name: Update STATUS.md
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update STATUS.md
        run: |
          echo "# Реестр состояния экосистемы" > docs/STATUS.md
          echo "Последнее обновление: $(date '+%Y-%m-%d %H:%M:%S')" >> docs/STATUS.md
          echo "## gallery.obrazslov.ru" >> docs/STATUS.md
          echo "- Статус: ✅ Шаблон загружен, статические страницы созданы" >> docs/STATUS.md
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/STATUS.md || mkdir docs && echo "# Реестр состояния" > docs/STATUS.md && git add docs/STATUS.md
          git commit -m "chore: auto-update STATUS.md" || exit 0
          git push
