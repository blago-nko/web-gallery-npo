name: Backup Blogger Metadata
on:
  schedule:
    - cron: '0 3 * * 0' # Каждое воскресенье в 03:00 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for Blogger Metadata Backup
        run: |
          echo "Metadata backup will be implemented via Python script when API credentials are configured in GitHub Secrets."
          mkdir -p shared-assets
          echo '{"status": "pending_api_setup"}' > shared-assets/blogger_image_metadata.json
      - name: Commit placeholder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add shared-assets/blogger_image_metadata.json
          git commit -m "chore: weekly metadata backup placeholder" || exit 0
          git push
