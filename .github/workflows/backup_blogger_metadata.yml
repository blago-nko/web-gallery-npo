name: Backup Blogger Metadata

on:
  schedule:
    # Каждое воскресенье в 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Ручной запуск

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Backup Blogger metadata
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python scripts/export_to_gallery.py --backup

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add shared-assets/blogger_image_metadata.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: weekly Blogger metadata backup" && git push)
